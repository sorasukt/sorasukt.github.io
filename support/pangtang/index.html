start:{icon:"👋",nav:"Getting started",title:"Welcome to PangTang",lead:"Set up your money workspace and record your first entry in a few calm steps.",sections:[["Sign in","Choose Sign in and complete authentication. Wait until PangTang returns you to the app before closing the tab."],["Create your workspace","Add a cash or bank account, choose its currency and enter the opening balance that matches your real records."],["Record the first entry","Use the + button, choose income or expense, then review the amount, account, category, date and note before saving."],["Good to know","PangTang is a recording and planning tool—not a bank balance or professional financial adviser. Verify important figures against original records."]]},
overview:{icon:"✨",nav:"Overview & AI",title:"Understand today at a glance",lead:"Overview connects your cash flow, plan and goals. AI turns the numbers into a short, plain-language check-in.",sections:[["Daily overview","Review income, expenses, net cash flow, budget use and goal progress. Change the period when you need a wider view."],["AI financial summary","The summary describes patterns in totals and categories and may suggest one next step. It can be incomplete and is not financial, tax or investment advice."],["Protect your information","Do not enter passwords, full card numbers or unnecessary personal data in an AI question."]]},

imports:{icon:"📄",nav:"Statements & reports",title:"Import carefully, export confidently",lead:"Premium tools reduce manual work, but every detected entry still needs your review.",sections:[["Import a statement","Choose a supported PDF and provide its password only when required. The password is used to open the file on your device."],["Review before saving","Check the date, amount, type, category and duplicates. Only selected and confirmed entries should be added."],["If import fails","Check file type, size and PDF password, then try again. Never email a bank statement or its password unless Support provides a secure method."],["Reports and exports","Use reports to review cash flow and categories. Export PDF, Excel or CSV when available, and protect downloaded files on shared devices."]]},
shortcuts:{icon:"⚡",nav:"Apple Shortcuts",title:"Add entries faster on Apple devices",lead:"A Shortcut can open a pre-filled entry that you review before saving.",sections:[["Copy a shortcut link","Open My account or More in PangTang and copy the income or expense shortcut URL."],["Build the Shortcut","In Apple Shortcuts, ask for Amount and optionally Note, insert those values into the copied URL and add Open URLs."],["Review every run","PangTang opens the entry form. Confirm account, category, currency and date before saving. Do not share a personal shortcut URL publicly."]]},
account:{icon:"🔐",nav:"Account & sign-in",title:"Manage your session safely",lead:"Authentication is handled separately from the finance workspace to keep account sessions controlled.",sections:[["Sign in","Start from PangTang, verify the sorasukt.com or trusted authentication domain, and complete the flow without closing the callback tab."],["Sign out","Open My account or More, choose Sign out and wait for the public welcome page. Close all browser tabs on a shared device."],["Login loop or expired session","Check the connection and device time, allow necessary cookies, disable a content blocker temporarily, or try a private window."],["Sign-out error","Use the recovery action below. It opens the authentication logout service again to close the remaining session."]]},

imports:{icon:"📄",nav:"Statement และรายงาน",title:"นำเข้าอย่างรอบคอบ ส่งออกอย่างมั่นใจ",lead:"เครื่องมือ Premium ลดงานกรอก แต่ทุกรายการยังต้องตรวจสอบ",sections:[["นำเข้า Statement","เลือก PDF ที่รองรับและใส่รหัสเมื่อจำเป็น รหัสใช้เปิดไฟล์บนอุปกรณ์ของคุณ"],["ตรวจก่อนบันทึก","ตรวจวันที่ จำนวน ประเภท หมวดหมู่ และรายการซ้ำ บันทึกเฉพาะรายการที่เลือกและยืนยัน"],["เมื่อนำเข้าไม่สำเร็จ","ตรวจชนิด ขนาด และรหัส PDF อย่าส่ง Statement หรือรหัสผ่านทางอีเมลทั่วไป"],["รายงานและการส่งออก","ใช้รายงานดูเงินสดและหมวดหมู่ ส่งออก PDF, Excel หรือ CSV เมื่อมี และปกป้องไฟล์บนเครื่องที่ใช้ร่วมกัน"]]},

start:{icon:"👋",nav:"Bien démarrer",title:"Bienvenue sur PangTang",lead:"Configurez votre espace financier et enregistrez votre première opération en quelques étapes.",sections:[["Se connecter","Choisissez Sign in et terminez l’authentification. Attendez le retour vers PangTang avant de fermer l’onglet."],["Créer l’espace","Ajoutez un compte espèces ou bancaire, choisissez sa devise et saisissez le solde initial réel."],["Première opération","Touchez +, choisissez un revenu ou une dépense, puis vérifiez montant, compte, catégorie, date et note."],["À savoir","PangTang est un outil de suivi et de planification, pas une banque ni un conseiller financier professionnel."]]},
overview:{icon:"✨",nav:"Aperçu et IA",title:"Comprendre la journée en un coup d’œil",lead:"L’aperçu relie flux de trésorerie, budget et objectifs ; l’IA résume les chiffres simplement.",sections:[["Aperçu quotidien","Consultez revenus, dépenses, flux net, budget utilisé et progression des objectifs."],["Résumé financier par IA","Il décrit les tendances des totaux et catégories. Il peut être incomplet et ne constitue pas un conseil financier, fiscal ou d’investissement."],["Protéger vos données","Ne saisissez pas de mot de passe, numéro de carte complet ni donnée personnelle inutile dans une question à l’IA."]]},
transactions:{icon:"↕️",nav:"Opérations",title:"Suivre entrées et sorties",lead:"Des opérations claires rendent les soldes et rapports utiles.",sections:[["Ajouter","Touchez +, choisissez revenu ou dépense, compte et catégorie, puis montant, devise, date et note."],["Modifier ou supprimer","Ouvrez l’opération dans Transactions et vérifiez ensuite solde et rapports."],["Opérations récurrentes","Pour les factures ou revenus réguliers. Un rappel ne transfère pas d’argent."],["Devises","Vérifiez la devise avant d’enregistrer ; le taux de référence peut différer de celui de la banque."]]},
planning:{icon:"🎯",nav:"Budgets et objectifs",title:"Transformer les données en plan",lead:"Les budgets encadrent les dépenses et les objectifs montrent l’avancement de l’épargne.",sections:[["Créer un budget","Choisissez une catégorie et une limite mensuelle. La barre indique les dépenses enregistrées."],["Créer un objectif","Ajoutez un nom, un montant cible et une date facultative, puis mettez à jour l’épargne réelle."],["Réviser","Une alerte budgétaire aide à planifier ; elle ne porte aucun jugement."]]},
imports:{icon:"📄",nav:"Relevés et rapports",title:"Importer avec soin, exporter sereinement",lead:"Les outils Premium réduisent la saisie, mais chaque ligne détectée doit être vérifiée.",sections:[["Importer","Choisissez un PDF pris en charge et fournissez son mot de passe seulement si nécessaire ; il sert à ouvrir le fichier sur l’appareil."],["Vérifier","Contrôlez date, montant, type, catégorie et doublons avant confirmation."],["En cas d’échec","Vérifiez format, taille et mot de passe. N’envoyez jamais un relevé ou son mot de passe par courriel ordinaire."],["Rapports et exports","Analysez flux et catégories, puis exportez en PDF, Excel ou CSV lorsque disponible."]]},
shortcuts:{icon:"⚡",nav:"Raccourcis Apple",title:"Ajouter plus vite sur Apple",lead:"Un raccourci ouvre une opération préremplie à vérifier avant sauvegarde.",sections:[["Copier le lien","Dans My account ou More, copiez l’URL revenu ou dépense."],["Créer","Demandez le montant et la note, insérez-les dans l’URL, puis ajoutez Ouvrir les URL."],["Toujours vérifier","Vérifiez compte, catégorie, devise et date. Ne publiez pas votre URL personnelle."]]},
account:{icon:"🔐",nav:"Compte et connexion",title:"Gérer la session en sécurité",lead:"L’authentification est séparée de l’espace financier.",sections:[["Connexion","Commencez depuis PangTang, vérifiez sorasukt.com ou le domaine d’authentification fiable, puis terminez le retour."],["Déconnexion","Dans My account ou More, déconnectez-vous et attendez la page publique. Fermez les onglets sur un appareil partagé."],["Boucle de connexion","Vérifiez réseau et heure, autorisez les cookies nécessaires, désactivez temporairement le bloqueur ou essayez une fenêtre privée."],["Erreur de déconnexion","Utilisez le bouton de récupération ci-dessous pour fermer à nouveau la session."]]},
troubleshoot:{icon:"🛟",nav:"Dépannage",title:"Résoudre les problèmes courants",lead:"Commencez par les étapes les moins perturbatrices et gardez la référence d’assistance.",sections:[["Page non actualisée","Vérifiez la connexion, rechargez une fois et mettez le navigateur à jour. Effacez les données du site en dernier recours."],["Solde incorrect","Vérifiez période, compte, devise, transferts, solde initial et doublons."],["Erreur d’authentification","Notez code, référence et heure. N’envoyez pas mot de passe, relevé complet, carte ou pièce d’identité par courriel ordinaire."],["Contact","team@sorasukt.com ou +66 61 548 4814 (Thaïlande)."]]}
}},
es:{ui:{help:"Centro de ayuda de PangTang",search:"Buscar ayuda",close:"Cerrar menú",open:"Abrir menú",no:"No hay una página de ayuda coincidente.",contact:"Contactar con soporte",logout:"Solucionar cierre de sesión"},pages:{
start:{icon:"👋",nav:"Primeros pasos",title:"Te damos la bienvenida a PangTang",lead:"Configura tu espacio financiero y registra el primer movimiento en pocos pasos.",sections:[["Iniciar sesión","Selecciona Sign in y completa la autenticación. Espera a volver a PangTang antes de cerrar la pestaña."],["Crear el espacio","Añade una cuenta de efectivo o bancaria, elige la moneda e introduce el saldo inicial real."],["Primer movimiento","Pulsa +, elige ingreso o gasto y revisa importe, cuenta, categoría, fecha y nota."],["Importante","PangTang es una herramienta de registro y planificación; no es un banco ni asesor financiero profesional."]]},
overview:{icon:"✨",nav:"Resumen e IA",title:"Comprende el día de un vistazo",lead:"El resumen conecta flujo de efectivo, presupuesto y objetivos; la IA explica los números brevemente.",sections:[["Resumen diario","Consulta ingresos, gastos, flujo neto, uso del presupuesto y progreso de objetivos."],["Resumen financiero con IA","Describe patrones de totales y categorías. Puede ser incompleto y no es asesoramiento financiero, fiscal ni de inversión."],["Protege tus datos","No escribas contraseñas, números completos de tarjeta ni información personal innecesaria en una pregunta a la IA."]]},
transactions:{icon:"↕️",nav:"Movimientos",title:"Registra entradas y salidas",lead:"Los registros claros hacen útiles los saldos e informes.",sections:[["Añadir","Pulsa +, elige ingreso o gasto, cuenta y categoría; introduce importe, moneda, fecha y nota."],["Editar o eliminar","Abre el movimiento en Transactions y comprueba después el saldo y los informes."],["Recurrentes","Úsalos para facturas o ingresos regulares. Un recordatorio no mueve dinero automáticamente."],["Monedas","Confirma la moneda antes de guardar; el tipo de referencia puede diferir del banco."]]},
planning:{icon:"🎯",nav:"Presupuestos y objetivos",title:"Convierte registros en un plan",lead:"Los presupuestos delimitan el gasto y los objetivos muestran el avance del ahorro.",sections:[["Crear presupuesto","Elige categoría y límite mensual. La barra muestra la proporción gastada registrada."],["Crear objetivo","Añade nombre, importe objetivo y fecha opcional; actualiza el ahorro real."],["Revisar","Una alerta es una señal para planificar, no un juicio sobre ti."]]},
imports:{icon:"📄",nav:"Extractos e informes",title:"Importa con cuidado y exporta con confianza",lead:"Las herramientas Premium reducen el trabajo, pero debes revisar cada elemento detectado.",sections:[["Importar extracto","Elige un PDF compatible e introduce la contraseña solo si es necesaria; se usa para abrir el archivo en tu dispositivo."],["Revisar","Comprueba fecha, importe, tipo, categoría y duplicados antes de confirmar."],["Si falla","Comprueba formato, tamaño y contraseña. No envíes el extracto o contraseña por correo ordinario."],["Informes y exportación","Revisa flujo y categorías; exporta PDF, Excel o CSV cuando esté disponible."]]},
shortcuts:{icon:"⚡",nav:"Atajos de Apple",title:"Añade registros más rápido en Apple",lead:"Un atajo abre un formulario prellenado para revisar antes de guardar.",sections:[["Copiar enlace","En My account o More, copia la URL de ingreso o gasto."],["Crear atajo","Pregunta importe y nota, insértalos en la URL y añade Abrir URLs."],["Revisar siempre","Confirma cuenta, categoría, moneda y fecha. No publiques tu URL personal."]]},
account:{icon:"🔐",nav:"Cuenta e inicio de sesión",title:"Gestiona la sesión con seguridad",lead:"La autenticación se procesa separada del espacio financiero.",sections:[["Iniciar sesión","Empieza desde PangTang, verifica sorasukt.com o el dominio de autenticación confiable y completa el retorno."],["Cerrar sesión","En My account o More, cierra sesión y espera la página pública. Cierra pestañas en dispositivos compartidos."],["Bucle de acceso","Comprueba red y hora, permite cookies necesarias, desactiva temporalmente bloqueadores o usa ventana privada."],["Error al cerrar sesión","Usa el botón de recuperación para volver a cerrar la sesión de autenticación."]]},
troubleshoot:{icon:"🛟",nav:"Solución de problemas",title:"Resuelve problemas comunes",lead:"Empieza por los pasos menos disruptivos y guarda la referencia de soporte.",sections:[["No se actualiza","Comprueba conexión, recarga una vez y actualiza el navegador. Borra datos del sitio solo como último recurso."],["Saldo incorrecto","Comprueba periodo, cuenta, moneda, transferencias, saldo inicial y duplicados."],["Error de autenticación","Anota código, referencia y hora. No envíes contraseña, extracto completo, tarjeta o identidad por correo ordinario."],["Contacto","team@sorasukt.com o +66 61 548 4814 (Tailandia)."]]}
}},
lo:{ui:{help:"ສູນຊ່ວຍເຫຼືອ PangTang",search:"ຄົ້ນຫາຄວາມຊ່ວຍເຫຼືອ",close:"ປິດເມນູ",open:"ເປີດເມນູ",no:"ບໍ່ພົບໜ້າຊ່ວຍເຫຼືອທີ່ກົງກັນ",contact:"ຕິດຕໍ່ຝ່າຍຊ່ວຍເຫຼືອ",logout:"ແກ້ໄຂການອອກຈາກລະບົບ"},pages:{
start:{icon:"👋",nav:"ເລີ່ມຕົ້ນ",title:"ຍິນດີຕ້ອນຮັບສູ່ PangTang",lead:"ຕັ້ງຄ່າພື້ນທີ່ການເງິນ ແລະ ບັນທຶກລາຍການທຳອິດໃນບໍ່ກີ່ຂັ້ນຕອນ",sections:[["ເຂົ້າລະບົບ","ເລືອກ Sign in ແລະ ຢືນຢັນຕົວຕົນໃຫ້ສຳເລັດ ລໍຖ້າກັບ PangTang ກ່ອນປິດແທັບ"],["ສ້າງພື້ນທີ່","ເພີ່ມບັນຊີເງິນສົດ ຫຼື ທະນາຄານ ເລືອກສະກຸນເງິນ ແລະ ຍອດເລີ່ມຕົ້ນ"],["ບັນທຶກທຳອິດ","ກົດ + ເລືອກລາຍຮັບ ຫຼື ລາຍຈ່າຍ ແລ້ວກວດຈຳນວນ ບັນຊີ ໝວດ ວັນທີ ແລະ ໝາຍເຫດ"],["ຄວນຮູ້","PangTang ເປັນເຄື່ອງມືບັນທຶກແລະວາງແຜນ ບໍ່ແມ່ນທະນາຄານ ຫຼື ທີ່ປຶກສາການເງິນ"]]},
overview:{icon:"✨",nav:"ພາບລວມ ແລະ AI",title:"ເຂົ້າໃຈການເງິນຂອງມື້ນີ້",lead:"ພາບລວມເຊື່ອມກະແສເງິນ ງົບ ແລະ ເປົ້າໝາຍ; AI ສະຫຼຸບເປັນພາສາງ່າຍ",sections:[["ພາບລວມລາຍວັນ","ເບິ່ງລາຍຮັບ ລາຍຈ່າຍ ກະແສເງິນສຸດທິ ການໃຊ້ງົບ ແລະ ຄວາມຄືບໜ້າ"],["ສະຫຼຸບດ້ວຍ AI","ອະທິບາຍແນວໂນ້ມຈາກຍອດລວມ ແລະ ໝວດ ອາດບໍ່ຄົບ ແລະ ບໍ່ແມ່ນຄຳປຶກສາການເງິນ"],["ປົກປ້ອງຂໍ້ມູນ","ຢ່າໃສ່ລະຫັດຜ່ານ ເລກບັດເຕັມ ຫຼື ຂໍ້ມູນສ່ວນຕົວທີ່ບໍ່ຈຳເປັນ"]]},
transactions:{icon:"↕️",nav:"ລາຍການ",title:"ຕິດຕາມເງິນເຂົ້າແລະອອກ",lead:"ລາຍການທີ່ຊັດເຈນເຮັດໃຫ້ຍອດແລະລາຍງານມີປະໂຫຍດ",sections:[["ເພີ່ມລາຍການ","ກົດ + ເລືອກລາຍຮັບ ຫຼື ລາຍຈ່າຍ ບັນຊີ ໝວດ ຈຳນວນ ສະກຸນເງິນ ແລະ ວັນທີ"],["ແກ້ໄຂ ຫຼື ລຶບ","ເປີດລາຍການໃນ Transactions ແລະ ກວດຍອດຫຼັງແກ້"],["ລາຍການປະຈຳ","ໃຊ້ສຳລັບບິນ ຫຼື ລາຍຮັບປະຈຳ ການແຈ້ງເຕືອນບໍ່ໄດ້ໂອນເງິນ"],["ຫຼາຍສະກຸນເງິນ","ກວດສະກຸນເງິນກ່ອນບັນທຶກ ອັດຕາອ້າງອີງອາດຕ່າງຈາກທະນາຄານ"]]},
planning:{icon:"🎯",nav:"ງົບ ແລະ ເປົ້າໝາຍ",title:"ປ່ຽນຂໍ້ມູນເປັນແຜນ",lead:"ງົບກຳນົດຂອບເຂດລາຍຈ່າຍ ແລະ ເປົ້າໝາຍສະແດງຄວາມຄືບໜ້າ",sections:[["ສ້າງງົບ","ເລືອກໝວດ ແລະ ວົງເງິນລາຍເດືອນ"],["ສ້າງເປົ້າໝາຍ","ໃສ່ຊື່ ຈຳນວນເປົ້າໝາຍ ແລະ ວັນທີຖ້າຕ້ອງການ"],["ທົບທວນ","ຄຳເຕືອນງົບແມ່ນສັນຍານການວາງແຜນ ບໍ່ແມ່ນການຕັດສິນ"]]},
imports:{icon:"📄",nav:"Statement ແລະ ລາຍງານ",title:"ນຳເຂົ້າຢ່າງລະມັດລະວັງ",lead:"ເຄື່ອງມື Premium ຫຼຸດວຽກກອກ ແຕ່ຕ້ອງກວດທຸກລາຍການ",sections:[["ນຳເຂົ້າ","ເລືອກ PDF ທີ່ຮອງຮັບ ແລະ ໃສ່ລະຫັດຖ້າຈຳເປັນ"],["ກວດກ່ອນບັນທຶກ","ກວດວັນທີ ຈຳນວນ ປະເພດ ໝວດ ແລະ ລາຍການຊ້ຳ"],["ຖ້າບໍ່ສຳເລັດ","ກວດຊະນິດ ຂະໜາດ ແລະ ລະຫັດ PDF ຢ່າສົ່ງ Statement ຫຼື ລະຫັດທາງອີເມວທົ່ວໄປ"],["ລາຍງານ","ເບິ່ງກະແສເງິນແລະໝວດ ສົ່ງອອກ PDF, Excel ຫຼື CSV ເມື່ອມີ"]]},
shortcuts:{icon:"⚡",nav:"Apple Shortcuts",title:"ບັນທຶກໄວຂຶ້ນໃນ Apple",lead:"Shortcut ເປີດແບບຟອມທີ່ກອກບາງສ່ວນໃຫ້ກວດກ່ອນບັນທຶກ",sections:[["ຄັດລອກລິ້ງ","ໃນ My account ຫຼື More ຄັດລອກ URL ລາຍຮັບ ຫຼື ລາຍຈ່າຍ"],["ສ້າງ Shortcut","ໃຫ້ຖາມ Amount ແລະ Note ໃສ່ຄ່າໃນ URL ແລ້ວເພີ່ມ Open URLs"],["ກວດທຸກຄັ້ງ","ກວດບັນຊີ ໝວດ ສະກຸນເງິນ ແລະ ວັນທີ ຢ່າເຜີຍແຜ່ URL ສ່ວນຕົວ"]]},

};
const order=["start","overview","transactions","planning","imports","shortcuts","account","troubleshoot"];
let lang="en",pageId="start";
const $=s=>document.querySelector(s);
function picker(){
  const current=languages.find(x=>x.id===lang);
  return `<button class="language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="flag" aria-hidden="true">${current.flag}</span><span class="label">${current.name}</span><span class="chev">⌃</span></button><div class="language-menu" role="listbox" hidden>${languages.map(x=>`<button type="button" role="option" data-lang="${x.id}" aria-checked="${x.id===lang}"><span class="flag" aria-hidden="true">${x.flag}</span><span lang="${x.id}">${x.name}</span></button>`).join("")}</div>`;
}
function bindPickers(){
 document.querySelectorAll("[data-language-picker]").forEach(root=>{
   root.innerHTML=picker();
   const trigger=root.querySelector(".language-trigger"),menu=root.querySelector(".language-menu");
   trigger.onclick=()=>{const open=menu.hidden;document.querySelectorAll(".language-menu").forEach(x=>x.hidden=true);menu.hidden=!open;trigger.setAttribute("aria-expanded",String(open))};
   menu.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));
 });
}
function renderNav(filter=""){
 const p=content[lang].pages,q=filter.trim().toLocaleLowerCase(lang);
 const ids=order.filter(id=>!q||[p[id].nav,p[id].title,p[id].lead,...p[id].sections.flat()].join(" ").toLocaleLowerCase(lang).includes(q));
 $("#navigation").innerHTML=ids.length?ids.map(id=>`<button type="button" data-page="${id}" class="${id===pageId?"active":""}"><i aria-hidden="true">${p[id].icon}</i><span>${p[id].nav}</span></button>`).join(""):`<p class="empty">${content[lang].ui.no}</p>`;
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>openPage(b.dataset.page));
}
function renderArticle(){
 const p=content[lang].pages[pageId],ui=content[lang].ui;
 document.title=`${p.title} | ${ui.help}`;$("#crumbTitle").textContent=p.nav;
 $("#article").innerHTML=`<div class="page-icon" aria-hidden="true">${p.icon}</div><h1>${p.title}</h1><p class="lead">${p.lead}</p>${p.sections.map(([h,t],i)=>`<section class="article-section"><h2>${h}</h2><p>${t}</p>${pageId==="account"&&i===3?`<div class="actions"><a class="button" href="/auth/logouterror">${ui.logout}</a></div>`:""}${pageId==="troubleshoot"&&i===3?`<div class="actions"><a class="button" href="mailto:team@sorasukt.com">${ui.contact}</a><a class="button secondary" href="/auth/logouterror">${ui.logout}</a></div>`:""}</section>`).join("")}`;
 $("#article").focus({preventScroll:true});window.scrollTo({top:0,behavior:"instant"});
}
function openPage(id,push=true){
 if(!content[lang].pages[id])id="start";pageId=id;if(push)history.pushState({page:id},"","#"+id);
 renderNav($("#searchInput").value);renderArticle();$("#sidebar").classList.remove("open");
}
function setLanguage(id){
 if(!content[id])return;lang=id;localStorage.setItem("pangtang-support-language",id);
 document.documentElement.lang=id;document.body.dataset.lang=id;$(".support-name").textContent=content[id].ui.help;
 $("#searchInput").placeholder=content[id].ui.search;$("#openMenu").setAttribute("aria-label",content[id].ui.open);$("#closeMenu").setAttribute("aria-label",content[id].ui.close);
 bindPickers();renderNav($("#searchInput").value="");renderArticle();
}
$("#openMenu").onclick=()=>$("#sidebar").classList.add("open");$("#closeMenu").onclick=()=>$("#sidebar").classList.remove("open");
$("#searchInput").oninput=e=>renderNav(e.target.value);window.onpopstate=()=>openPage(location.hash.slice(1)||"start",false);
window.addEventListener("scroll",()=>$("#topbar").classList.toggle("scrolled",scrollY>4));
document.addEventListener("click",e=>{if(!e.target.closest("[data-language-picker]"))document.querySelectorAll(".language-menu").forEach(x=>x.hidden=true)});
lang=content[localStorage.getItem("pangtang-support-language")]?localStorage.getItem("pangtang-support-language"):"en";
pageId=content[lang].pages[location.hash.slice(1)]?location.hash.slice(1):"start";
setLanguage(lang);history.replaceState({page:pageId},"","#"+pageId);
</script>
</body>
