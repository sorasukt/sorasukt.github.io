<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>กำลังเปิดหน้าลงชื่อใช้งาน — sorasukt</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{text-align:center;padding:24px;max-width:520px}.spinner{width:28px;height:28px;border:2px solid #ddd;border-top-color:#111;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    p{color:#666;line-height:1.6}a{color:#111}
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>กำลังเปิดหน้าลงชื่อใช้งาน</h1>
    <p id="status">กำลังเชื่อมต่อกับ Auth0 Universal Login…</p>
    <p><a href="/tarot/">กลับไปหน้า Tarot</a></p>
  </main>
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.4/auth0-spa-js.production.js"></script>
  <script src="/auth/auth0-config.js"></script>
  <script src="/auth/auth0-client.js"></script>
  <script>
    (async()=>{
      try{
        const params = new URLSearchParams(window.location.search);
        const returnTo = params.get("returnTo") || "/tarot/";
        await window.SorasuktAuth.login(returnTo);
      }catch(error){
        console.error("Auth0 sign-in bootstrap failed",error);
        document.getElementById("status").textContent="ไม่สามารถเปิดหน้าลงชื่อใช้งานได้: "+(error?.message||"Unknown error");
      }
    })();
  </script>
</body>
</html>
